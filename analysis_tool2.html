<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户活跃度区间分析工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .main-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .chart-container {
            flex: 1;
            min-width: 600px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
        #chart {
            width: 100%;
            height: 500px;
            cursor: crosshair;
        }
        .controls-panel {
            width: 300px;
            min-width: 280px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #e0e0e0;
        }
        .controls-panel h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 8px;
        }
        .control-group {
            margin-bottom: 16px;
        }
        .control-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .control-group input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            background: white;
        }
        .control-group input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        .btn-primary:hover { background: #45a049; }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover { background: #c82333; }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .info-panel {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.8;
            min-height: 120px;
        }
        .info-panel .highlight {
            color: #d32f2f;
            font-weight: bold;
        }
        .info-panel .highlight-blue {
            color: #1976d2;
            font-weight: bold;
        }
        .preset-functions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .preset-functions .btn {
            font-size: 11px;
            padding: 4px 10px;
            background: #e9ecef;
            color: #333;
            border: 1px solid #ddd;
        }
        .preset-functions .btn:hover { background: #dee2e6; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 8px 12px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 12px;
            color: #555;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 12px;
            color: #555;
        }
        .stats-bar span { white-space: nowrap; }
        .stats-bar .num { font-weight: bold; color: #333; }
        @media (max-width: 900px) {
            .main-area { flex-direction: column; }
            .controls-panel { width: 100%; }
            .chart-container { min-width: unset; }
            #chart { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>用户活跃度区间分析工具</h1>
        <div class="subtitle">共 23,542 个账户 · 点击散点图选择周期区间，自动计算高活跃值账户比例</div>

        <div class="main-area">
            <div class="chart-container">
                <div id="chart"></div>
                <div class="stats-bar" id="statsBar">
                    <span>总账户: <span class="num" id="totalAccounts">23,542</span></span>
                    <span>周期范围: <span class="num" id="periodRange">1 - 895</span></span>
                    <span>活跃值范围: <span class="num" id="activeRange">0.0119 - 128.16</span></span>
                </div>
                <div class="status-bar">
                    <span id="statusText">点击图表内红点选择周期区间</span>
                    <span>
                        <button class="btn btn-danger btn-sm" id="clearBtn">清除选区</button>
                    </span>
                </div>
            </div>

            <div class="controls-panel">
                <h3>阈值函数设置</h3>
                <div class="control-group">
                    <label for="funcInput">阈值函数 f(x) =</label>
                    <input type="text" id="funcInput" value="0.1" placeholder="例如: 0.05 + 0.001*x">
                    <div style="font-size:11px;color:#888;margin-top:4px;">使用 x 表示周期，支持 + - * / ** 和 Math.sin, Math.exp 等</div>
                </div>
                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <button class="btn btn-primary" id="applyFuncBtn">应用函数</button>
                    <button class="btn btn-secondary" id="resetFuncBtn">重置为 0.1</button>
                </div>

                <div class="control-group">
                    <label>预设函数模板</label>
                    <div class="preset-functions">
                        <button class="btn" data-func="1.1*15.47/(1337-x)">近似弧线</button>
                        <button class="btn" data-func="0.05 + 0.001*x">线性递增</button>
                        <button class="btn" data-func="0.02 + 0.01*Math.sqrt(x-100)">平方根增长</button>
                        <button class="btn" data-func="0.01 + 0.0001*Math.pow(x, 1.5)">指数增长</button>
                    </div>
                </div>

                <div class="info-panel" id="infoPanel">
                    <div style="color:#856404;">
                        <strong>使用说明</strong><br>
                        1. 点击选择区间起点（第一次点击）<br>
                        2. 点击选择区间终点（第二次点击）<br>
                        3. 程序自动计算该区间内活跃值>阈值的账户比例<br>
                        4. 自定义阈值函数f(x)以调整判断标准
                    </div>
                </div>
            </div>
        </div>
    </div>

        // 解析数据
        const periods = REAL_DATA.map(d => d[0]);
        const activeValues = REAL_DATA.map(d => d[1]);
        const data = { periods, activeValues };
        
        // ============ECharts配置============
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        
        const scatterData = data.periods.map((p, i) => [p, data.activeValues[i]]);
        
        // 当前选中的区间
        let selectionStart = null;
        let selectionEnd = null;
        
        // 当前阈值函数
        let thresholdFunc = (x) => 0.1;
        let currentFuncStr = '0.1';
        
        // 统计信息
        const totalAccounts = data.periods.length;
        document.getElementById('totalAccounts').textContent = totalAccounts.toLocaleString();
        document.getElementById('periodRange').textContent = 
            `${Math.min(...data.periods)} - ${Math.max(...data.periods)}`;
        document.getElementById('activeRange').textContent = 
            `${Math.min(...data.activeValues).toFixed(4)} - ${Math.max(...data.activeValues).toFixed(2)}`;
        
        // ============生成函数曲线============
        function generateFuncLine(func, xMin, xMax, numPoints = 200) {
            const points = [];
            const step = (xMax - xMin) / numPoints;
            for (let x = xMin; x <= xMax; x += step) {
                try {
                    const y = func(x);
                    if (isFinite(y) && y > 0) {
                        points.push([x, y]);
                    }
                } catch(e) {
                    // 跳过无效点
                }
            }
            return points;
        }
        
        // ============图表选项============
        function getOption() {
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (params.data && params.data.length >= 2) {
                            return `周期: ${params.data[0]}<br/>活跃值: ${params.data[1].toFixed(4)}`;
                        }
                        return '';
                    }
                },
                grid: {
                    left: '6%',
                    right: '4%',
                    bottom: '8%',
                    top: '6%'
                },
                xAxis: {
                    name: '创建周期',
                    nameLocation: 'center',
                    nameGap: 30,
                    nameTextStyle: { fontSize: 13 },
                    min: 0,
                    max: 900,
                    splitLine: { show: true, lineStyle: { type: 'dashed', opacity: 0.3 } }
                },
                yAxis: {
                    name: '修正活跃值 (对数)',
                    nameLocation: 'center',
                    nameGap: 50,
                    nameTextStyle: { fontSize: 13 },
                    type: 'log',
                    min: 0.005,
                    max: 200,
                    splitLine: { show: true, lineStyle: { type: 'dashed', opacity: 0.3 } }
                },
                dataZoom: [
                    {
                        type: 'slider',
                        xAxisIndex: 0,
                        start: 0,
                        end: 100,
                        height: 20,
                        bottom: 0
                    },
                    {
                        type: 'slider',
                        yAxisIndex: 0,
                        start: 0,
                        end: 100,
                        width: 20,
                        right: 0
                    }
                ],
                series: [
                    {
                        name: '账户',
                        type: 'scatter',
                        data: scatterData,
                        symbolSize: 3,
                        itemStyle: {
                            color: '#e74c3c',
                            opacity: 0.5
                        },
                        large: true,
                        largeThreshold: 2000,
                        emphasis: {
                            itemStyle: {
                                opacity: 1
                            }
                        }
                    },
                    // ======阈值函数曲线======
                    {
                        name: '阈值函数 f(x)',
                        type: 'line',
                        data: generateFuncLine(thresholdFunc, 0, 900),
                        smooth: true,
                        symbol: 'none',
                        lineStyle: {
                            color: '#1a237e',
                            width: 3,
                            type: 'solid'
                        },
                        itemStyle: {
                            color: '#1a237e'
                        },
                        z: 2,
                        tooltip: {
                            formatter: function(params) {
                                if (params.data && params.data.length >= 2) {
                                    return `阈值函数<br>周期: ${params.data[0]}<br/>阈值: ${params.data[1].toFixed(4)}`;
                                }
                                return '';
                            }
                        }
                    }
                ]
            };
            
            // 如果有选区，添加标记
            if (selectionStart !== null && selectionEnd !== null) {
                const start = Math.min(selectionStart, selectionEnd);
                const end = Math.max(selectionStart, selectionEnd);
                
                const inRange = scatterData.filter(d => d[0] >= start && d[0] <= end);
                const total = inRange.length;
                
                let highCount = 0;
                inRange.forEach(d => {
                    if (d[1] > thresholdFunc(d[0])) highCount++;
                });
                const ratio = total > 0 ? (highCount / total * 100) : 0;
                
                // 添加标记区域
                option.series.push({
                    name: '选中区间',
                    type: 'custom',
                    data: [],
                    renderItem: function(params, api) {
                        const coord = api.coord([start, 0]);
                        const coordEnd = api.coord([end, 200]);
                        return {
                            type: 'rect',
                            shape: {
                                x: coord[0],
                                y: coord[1],
                                width: coordEnd[0] - coord[0],
                                height: coordEnd[1] - coord[1]
                            },
                            style: {
                                fill: 'rgba(52, 152, 219, 0.15)',
                                stroke: 'rgba(52, 152, 219, 0.6)',
                                lineWidth: 2
                            },
                            silent: true
                        };
                    },
                    z: 1
                });
                
                // 添加标注文字
                const midX = (start + end) / 2;
                const midY = 0.05;
                option.series.push({
                    name: '区间信息',
                    type: 'custom',
                    data: [],
                    renderItem: function(params, api) {
                        const coord = api.coord([midX, midY]);
                        return {
                            type: 'group',
                            children: [{
                                type: 'rect',
                                shape: {
                                    x: coord[0] - 80,
                                    y: coord[1] - 25,
                                    width: 160,
                                    height: 50
                                },
                                style: {
                                    fill: 'rgba(255, 255, 255, 0.9)',
                                    stroke: '#2980b9',
                                    lineWidth: 1
                                },
                                silent: true
                            }, {
                                type: 'text',
                                style: {
                                    text: `区间 ${start}-${end}\n比例: ${ratio.toFixed(1)}% (${highCount}/${total})`,
                                    textAlign: 'center',
                                    textVerticalAlign: 'middle',
                                    fontSize: 12,
                                    fontWeight: 'bold',
                                    fill: '#2c3e50'
                                },
                                shape: {
                                    x: coord[0],
                                    y: coord[1]
                                },
                                silent: true
                            }]
                        };
                    },
                    z: 10
                });
            }
            
            return option;
        }
        
        function updateChart() {
            myChart.setOption(getOption(), true);
        }
        
        // ============ 交互事件 ============
        function handleChartClick(params) {
            if (!params.data || params.data.length < 2) {
                return;
            }
            
            const period = Math.round(params.data[0]);
            
            if (selectionStart === null) {
                selectionStart = period;
                document.getElementById('statusText').textContent = 
                    `起点: ${period}，请点击选择终点`;
                updateChart();
            } else {
                selectionEnd = period;
                const start = Math.min(selectionStart, selectionEnd);
                const end = Math.max(selectionStart, selectionEnd);
                document.getElementById('statusText').textContent = 
                    `区间 [${start}, ${end}] 已选定`;
                
                const inRange = scatterData.filter(d => d[0] >= start && d[0] <= end);
                const total = inRange.length;
                
                let highCount = 0;
                inRange.forEach(d => {
                    if (d[1] > thresholdFunc(d[0])) highCount++;
                });
                const ratio = total > 0 ? (highCount / total * 100) : 0;
                
                const panel = document.getElementById('infoPanel');
                panel.innerHTML = `
                    <div style="color:#155724;">
                        <strong>分析结果</strong><br>
                        <span class="highlight-blue">周期区间:</span> ${start} - ${end}<br>
                        <span class="highlight-blue">区间账户数:</span> ${total.toLocaleString()}<br>
                        <span class="highlight-blue">高活跃值账户:</span> ${highCount.toLocaleString()}<br>
                        <span class="highlight">高活跃值比例:</span> ${ratio.toFixed(2)}%<br>
                        <span style="font-size:12px;color:#666;">阈值函数: ${funcInput.value}</span>
                    </div>
                `;
                
                selectionStart = null;
                selectionEnd = null;
                updateChart();
            }
        }
        
        myChart.on('click', handleChartClick);
        
        // ============控制函数============
        const funcInput = document.getElementById('funcInput');
        
        function applyFunction() {
            const funcStr = funcInput.value.trim();
            try {
                const testFunc = new Function('x', `return (${funcStr})`);
                const testResult = testFunc(100);
                if (typeof testResult !== 'number' || !isFinite(testResult)) {
                    throw new Error('函数返回值无效');
                }
                
                thresholdFunc = function(x) {
                    const fn = new Function('x', `return (${funcStr})`);
                    if (Array.isArray(x)) {
                        return x.map(v => fn(v));
                    }
                    return fn(x);
                };
                currentFuncStr = funcStr;
                
                document.getElementById('statusText').textContent = 
                    `阈值函数已更新: f(x) = ${funcStr}`;
                
                selectionStart = null;
                selectionEnd = null;
                updateChart();
                
                const panel = document.getElementById('infoPanel');
                panel.innerHTML = `
                    <div style="color:#155724;">
                        <strong>函数已应用</strong><br>
                        当前阈值函数: f(x) = ${funcStr}<br>
                        <span style="font-size:12px;color:#666;">点击图表内红点选择区间查看分析结果</span>
                    </div>
                `;
            } catch (e) {
                document.getElementById('statusText').textContent = 
                    `函数错误: ${e.message}`;
                const panel = document.getElementById('infoPanel');
                panel.innerHTML = `
                    <div style="color:#721c24;">
                        <strong>函数错误</strong><br>
                        ${e.message}<br>
                        <span style="font-size:12px;">请检查函数语法，使用 x 作为变量名</span>
                    </div>
                `;
            }
        }
        
        document.getElementById('applyFuncBtn').addEventListener('click', applyFunction);
        
        document.getElementById('resetFuncBtn').addEventListener('click', function() {
            funcInput.value = '0.1';
            applyFunction();
        });
        
        document.querySelectorAll('.preset-functions .btn').forEach(btn => {
            btn.addEventListener('click', function() {
                funcInput.value = this.dataset.func;
                applyFunction();
            });
        });
        
        document.getElementById('clearBtn').addEventListener('click', function() {
            selectionStart = null;
            selectionEnd = null;
            document.getElementById('statusText').textContent = 
                '点击图表内红点选择周期区间';
            const panel = document.getElementById('infoPanel');
            panel.innerHTML = `
                <div style="color:#856404;">
                    <strong>使用说明</strong><br>
                    1. 点击选择区间起点（第一次点击）<br>
                    2. 点击选择区间终点（第二次点击）<br>
                    3. 程序自动计算该区间内活跃值>阈值的账户比例<br>
                    4. 自定义阈值函数f(x)以调整判断标准
                </div>
            `;
            updateChart();
        });
        
        window.addEventListener('resize', function() {
            myChart.resize();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement === funcInput) {
                applyFunction();
            }
            if (e.key === 'Escape') {
                document.getElementById('clearBtn').click();
            }
        });
        
        //初始化
        updateChart();
        
        console.log('用户活跃度区间分析工具已加载');
        console.log(`共 ${totalAccounts.toLocaleString()} 个账户`);
